name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore The.Oracle.sln

      - name: Build
        run: dotnet build The.Oracle.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test The.Oracle.sln --no-build --configuration Release

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f src/Oracle.Api/Dockerfile -t the-oracle:ci .
